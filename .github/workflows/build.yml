name: Manual Unity Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Game version"
        required: true
        default: "0.1.0"

permissions:
  contents: read

env:
  UNITY_PATH: C:\Program Files\Unity\Hub\Editor\6000.4.6f1\Editor\Unity.exe
  PROJECT_PATH: ${{ github.workspace }}

jobs:
  build-windows:
    name: Build Windows
    runs-on: [self-hosted, Windows, unity6]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false

      - name: Git LFS pull
        shell: powershell
        run: git lfs pull

      - name: Clean previous builds
        shell: powershell
        run: |
          if (Test-Path "Builds") {
            Remove-Item "Builds" -Recurse -Force
          }

      - name: Build Windows
        shell: powershell
        run: |
          & "${{ env.UNITY_PATH }}" `
            -batchmode `
            -quit `
            -nographics `
            -projectPath "${{ env.PROJECT_PATH }}" `
            -buildTarget StandaloneWindows64 `
            -executeMethod BuildScript.BuildWindows `
            -buildVersion "${{ github.event.inputs.version }}" `
            -buildNumber "${{ github.run_number }}" `
            -logFile "${{ github.workspace }}\unity-windows-build.log"

      - name: Upload Unity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-windows-log
          path: unity-windows-build.log

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.version }}-StandaloneWindows64
          path: Builds/Windows
          if-no-files-found: error
          retention-days: 30

  build-webgl:
    name: Build WebGL
    runs-on: [self-hosted, Windows, unity6]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          clean: false

      - name: Git LFS pull
        shell: powershell
        run: git lfs pull

      - name: Clean previous builds
        shell: powershell
        run: |
          if (Test-Path "Builds\WebGL") {
            Remove-Item "Builds\WebGL" -Recurse -Force
          }

      - name: Build WebGL
        shell: powershell
        run: |
          & "${{ env.UNITY_PATH }}" `
            -batchmode `
            -quit `
            -nographics `
            -projectPath "${{ env.PROJECT_PATH }}" `
            -buildTarget WebGL `
            -executeMethod BuildScript.BuildWebGL `
            -buildVersion "${{ github.event.inputs.version }}" `
            -buildNumber "${{ github.run_number }}" `
            -logFile "${{ github.workspace }}\unity-webgl-build.log"

      - name: Upload Unity log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-webgl-log
          path: unity-webgl-build.log

      - name: Upload WebGL build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.version }}-WebGL
          path: Builds/WebGL
          if-no-files-found: error
          retention-days: 30
