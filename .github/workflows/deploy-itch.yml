name: Manual Deploy to itch.io

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID from Manual Unity Build"
        required: true
      version:
        description: "Game version"
        required: true
        default: "0.1.0"

permissions:
  contents: read
  actions: read

env:
  ITCH_USER: ${{ vars.ITCH_USER }}
  ITCH_GAME: ${{ vars.ITCH_GAME }}
  BUTLER_PATH: C:\Tools\butler\butler.exe

jobs:
  deploy:
    name: Deploy existing artifacts
    runs-on: [self-hosted, Windows, unity6]

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.version }}-StandaloneWindows64
          run-id: ${{ github.event.inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: BuildsToDeploy/Windows

      - name: Download WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.version }}-WebGL
          run-id: ${{ github.event.inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: BuildsToDeploy/WebGL

      - name: Validate Butler
        shell: powershell
        run: |
          if (!(Test-Path "${{ env.BUTLER_PATH }}")) {
            Write-Error "Butler not found at ${{ env.BUTLER_PATH }}"
            exit 1
          }

          & "${{ env.BUTLER_PATH }}" -V

      - name: Validate itch variables
        shell: powershell
        run: |
          if ("${{ env.ITCH_USER }}" -eq "") {
            Write-Error "ITCH_USER variable is empty"
            exit 1
          }

          if ("${{ env.ITCH_GAME }}" -eq "") {
            Write-Error "ITCH_GAME variable is empty"
            exit 1
          }

          if ("${{ secrets.BUTLER_API_KEY }}" -eq "") {
            Write-Error "BUTLER_API_KEY secret is empty"
            exit 1
          }

      - name: Show downloaded artifacts
        shell: powershell
        run: |
          Write-Host "Windows build:"
          Get-ChildItem "BuildsToDeploy\Windows" -Recurse

          Write-Host "WebGL build:"
          Get-ChildItem "BuildsToDeploy\WebGL" -Recurse

      - name: Push Windows build
        shell: powershell
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          & "${{ env.BUTLER_PATH }}" push `
            "BuildsToDeploy\Windows" `
            "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:windows" `
            --userversion "${{ github.event.inputs.version }}"

      - name: Push WebGL build
        shell: powershell
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          & "${{ env.BUTLER_PATH }}" push `
            "BuildsToDeploy\WebGL" `
            "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:webgl" `
            --userversion "${{ github.event.inputs.version }}"
