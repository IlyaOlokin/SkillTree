name: Manual Deploy to itch.io

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID from Manual Unity Build"
        required: true
      version:
        description: "Game version"
        required: true
        default: "0.1.0"

permissions:
  contents: read
  actions: read

env:
  ITCH_USER: ${{ vars.ITCH_USER }}
  ITCH_GAME: ${{ vars.ITCH_GAME }}

jobs:
  deploy:
    name: Deploy existing artifacts
    runs-on: [self-hosted, Windows, unity6]

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.version }}-StandaloneWindows64
          run-id: ${{ github.event.inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: BuildsToDeploy/Windows

      - name: Download WebGL artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.version }}-WebGL
          run-id: ${{ github.event.inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: BuildsToDeploy/WebGL

      - name: Install Butler
        shell: powershell
        run: |
          $butlerDir = "$env:USERPROFILE\butler"
          $butlerZip = "$env:TEMP\butler.zip"

          if (!(Test-Path "$butlerDir\butler.exe")) {
            New-Item -ItemType Directory -Force -Path $butlerDir | Out-Null

            Invoke-WebRequest `
              -Uri "https://broth.itch.ovh/butler/windows-amd64/LATEST/archive/default" `
              -OutFile $butlerZip

            Expand-Archive `
              -Path $butlerZip `
              -DestinationPath $butlerDir `
              -Force
          }

          echo "$butlerDir" >> $env:GITHUB_PATH

      - name: Validate Butler
        shell: powershell
        run: butler -V

      - name: Validate itch variables
        shell: powershell
        run: |
          if ("${{ env.ITCH_USER }}" -eq "") {
            Write-Error "ITCH_USER variable is empty"
            exit 1
          }

          if ("${{ env.ITCH_GAME }}" -eq "") {
            Write-Error "ITCH_GAME variable is empty"
            exit 1
          }

      - name: Push Windows build
        shell: powershell
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push `
            "BuildsToDeploy/Windows" `
            "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:windows" `
            --userversion "${{ github.event.inputs.version }}"

      - name: Push WebGL build
        shell: powershell
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          butler push `
            "BuildsToDeploy/WebGL" `
            "${{ env.ITCH_USER }}/${{ env.ITCH_GAME }}:webgl" `
            --userversion "${{ github.event.inputs.version }}"
